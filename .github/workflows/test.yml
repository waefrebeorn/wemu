name: wemu-gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run every WEMU gate from clean
        shell: bash
        env:
          # The host-native SIGSYS/PKU leg is kernel-ABI sensitive and is
          # verified in the local full gate; the shared runner cannot host it.
          WEMU_SKIP_NATIVE: '1'
        run: |
          set +e
          make -j"$(nproc)" test-clean 2>&1 | tee /tmp/wemu-gates.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::WEMU gates fails rc=$rc: $(grep -n -B8 'FAIL' /tmp/wemu-gates.log | head -24 | tr '\n' ' ')"
            echo "::error::WEMU gates failed rc=$rc TAIL: $(tail -c 1600 /tmp/wemu-gates.log | tr '\n' ' ')"
          fi
          exit "$rc"
      - name: ASan + UBSan differential gates
        shell: bash
        run: |
          set +e
          make test_sanitize 2>&1 | tee /tmp/wemu-sanitize.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::WEMU sanitizer gate failed rc=$rc: $(tail -c 1600 /tmp/wemu-sanitize.log | tr '\n' ' ')"
          fi
          exit "$rc"
